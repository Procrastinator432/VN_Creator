[package]
name = "VN_Creator"
version = "1.1.0"
edition = "2024"
authors = ["VN Creator Team"]
description = "A Visual Novel Studio and Player built with egui."
license = "MIT"
repository = "https://github.com/yourusername/VN_Creator"
keywords = ["visual-novel", "game-engine", "egui"]
categories = ["games", "gui"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
eframe = "0.34.2"
egui = { version = "0.34.2", features = ["serde"] }
egui_extras = { version = "0.34.2", features = ["all_loaders"] }
rodio = "0.22.2"
image = "0.25.10"
rfd = "0.17.2"